name: ${PROJECT_NAME:-ajedrezlapaz}

services:
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-ajedrezlapaz}-redis
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m
      timeout: 3s
      retries: 5
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - webnet

  ws:
    build:
      context: .
      dockerfile: docker/ws/Dockerfile
    image: ${PROJECT_NAME:-ajedrezlapaz}-ws
    container_name: ${PROJECT_NAME:-ajedrezlapaz}-ws
    hostname: dev
    working_dir: /alp
    command: zsh
    tty: true
    stdin_open: true
    environment:
      NODE_ENV: development
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SHELL: /bin/zsh
      EDITOR: nvim
      VISUAL: nvim
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    volumes:
      - ${UI_PATH:-../ui}:/alp/ui
      - ${API_PATH:-../api}:/alp/api
      - ${OPS_PATH:-.}:/alp/ops
      - ${DOTFILES_PATH:-${HOME}/Dev/.dotfiles}:/alp/dotfiles:ro
      - ${HOME}/.ssh:/home/mario/.ssh:ro
      - ws-home:/home/mario
      - ws-bun-cache:/home/mario/.bun/install/cache
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - webnet

  dev-ui:
    build:
      context: .
      dockerfile: docker/dev-ui/Dockerfile
    image: ${PROJECT_NAME:-ajedrezlapaz}-dev-ui
    container_name: ${PROJECT_NAME:-ajedrezlapaz}-dev-ui
    hostname: dev
    working_dir: /alp/ui
    command: sh -lc "bun install && bun --bun run dev --host 0.0.0.0"
    tty: true
    stdin_open: true
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      API_URL: http://dev-api:4000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${DEV_UI_PORT:-5173}:5173"
    volumes:
      - ${UI_PATH:-../ui}:/alp/ui
      - dev-ui-node-modules:/alp/ui/node_modules
      - dev-ui-bun-cache:/home/mario/.bun/install/cache
    networks:
      - webnet

  dev-api:
    build:
      context: .
      dockerfile: docker/dev-api/Dockerfile
    image: ${PROJECT_NAME:-ajedrezlapaz}-dev-api
    container_name: ${PROJECT_NAME:-ajedrezlapaz}-dev-api
    hostname: dev
    working_dir: /alp/api
    command: sh -lc "bun install && bun run db:migrate && bun run dev"
    tty: true
    stdin_open: true
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4000
      SQLITE_PATH: ${SQLITE_PATH:-/alp/api/data/app.db}
      FRONTEND_URL: ${DEV_FRONTEND_URL:-http://localhost:5173}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LICHESS_CLIENT_ID: ${LICHESS_CLIENT_ID:-}
      PUSH_NOTIFICATION_API_KEY: ${PUSH_NOTIFICATION_API_KEY:-}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ${API_PATH:-../api}:/alp/api
      - dev-api-node-modules:/alp/api/node_modules
      - dev-api-bun-cache:/home/mario/.bun/install/cache
      - dev-api-sqlite-data:/alp/api/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  ws-home:
  ws-bun-cache:
  dev-ui-node-modules:
  dev-ui-bun-cache:
  dev-api-node-modules:
  dev-api-bun-cache:
  dev-api-sqlite-data:
