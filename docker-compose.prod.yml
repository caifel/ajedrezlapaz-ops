name: ${PROJECT_NAME:-ajedrezlapaz}

services:
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-ajedrezlapaz}-prod-redis
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "${PROD_REDIS_PORT:-6379}:6379"
    networks:
      - webnet

  prod-ui:
    build:
      context: ${UI_PATH:-../ui}
      dockerfile: Dockerfile
    image: ${PROJECT_NAME:-ajedrezlapaz}-prod-ui
    container_name: ${PROJECT_NAME:-ajedrezlapaz}-prod-ui
    environment:
      NODE_ENV: production
      API_URL: http://prod-api:8081
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
    ports:
      - "${PROD_UI_PORT:-8080}:8080"
    networks:
      - webnet

  prod-api:
    build:
      context: ${API_PATH:-../api}
      dockerfile: Dockerfile
    image: ${PROJECT_NAME:-ajedrezlapaz}-prod-api
    container_name: ${PROJECT_NAME:-ajedrezlapaz}-prod-api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8081
      SQLITE_PATH: /app/data/app.db
      FRONTEND_URL: ${PROD_FRONTEND_URL:-http://localhost:8080}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required in production}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@support.ajedrezlapaz.com}
    ports:
      - "${PROD_API_PORT:-8081}:8081"
    volumes:
      - prod-api-sqlite-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  prod-api-sqlite-data:
